name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SCSCompanion.csproj -p:Platform=x64
      - name: Build
        run: dotnet build SCSCompanion.csproj -c Release -p:Platform=x64 --no-restore
